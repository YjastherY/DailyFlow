<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyFlow — задачи</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <a class="logo" href="index.html">DailyFlow</a>

    <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="tasks.html">Задачи</a>
        <a href="analytics.html">Аналитика</a>
    </nav>
</header>

<main class="page">
    <section class="page-header">
        <p class="badge">Task manager</p>
        <h1>Мои задачи</h1>
        <p>Добавляй задачи, выбирай приоритет и отмечай выполнение.</p>
    </section>

    <section class="tasks-layout">
        <form class="task-form" id="taskForm">
            <h2>Новая задача</h2>

            <label>
                Название задачи
                <input type="text" id="taskTitle" placeholder="Например: сделать отчёт" required>
            </label>

            <label>
                Описание
                <textarea id="taskDescription" rows="4" placeholder="Короткая заметка к задаче"></textarea>
            </label>

            <label>
                Категория
                <select id="taskCategory">
                    <option value="Работа">Работа</option>
                    <option value="Учёба">Учёба</option>
                    <option value="Дом">Дом</option>
                    <option value="Здоровье">Здоровье</option>
                    <option value="Личное">Личное</option>
                </select>
            </label>

            <label>
                Приоритет
                <select id="taskPriority">
                    <option value="Высокий">Высокий</option>
                    <option value="Средний">Средний</option>
                    <option value="Низкий">Низкий</option>
                </select>
            </label>

            <label>
                Дедлайн
                <input type="date" id="taskDeadline" required>
            </label>

            <button class="button primary" type="submit">Добавить задачу</button>

            <p class="form-message" id="formMessage"></p>
        </form>

        <section class="task-list-section">
            <div class="list-top">
                <h2>Список задач</h2>

                <div class="filters">
                    <label>
                        Статус
                        <select id="taskFilter">
                            <option value="Все">Все</option>
                            <option value="Активные">Активные</option>
                            <option value="Выполненные">Выполненные</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="task-list" id="taskList"></div>
        </section>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
